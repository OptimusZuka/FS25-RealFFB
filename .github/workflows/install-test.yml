name: install-test

# Installs, reconfigures and uninstalls FS25 RealFFB on a clean Windows machine, with the real official
# HidHide. No steering wheel is attached (wheel detection is covered by the simulated tests in build.bat).
# Runs on pushes to the 'install-test' branch and on demand.
on:
  push:
    branches: [install-test, 'ci-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }

      - name: Build (with unit tests)
        shell: cmd
        run: build.bat

      - name: Unit test results
        shell: cmd
        run: build\SetupTests.exe

      - name: Install / configure / uninstall test
        shell: pwsh
        run: .\tests\install-test.ps1
