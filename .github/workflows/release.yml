# Publica uma versao: enviar o commit para o ramo 'lancamento' (ou Actions > release > Run workflow).
# A etiqueta vX.Y.Z (igual ao ficheiro VERSION) e criada pelo proprio GitHub.
# Cria um rascunho de Release com o instalador e o SHA256SUMS.txt. O rascunho so fica publico
# quando o autor o publica manualmente no GitHub (revisao humana antes de cada versao).
name: release

on:
  push:
    branches: [lancamento]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }

      - name: Compilar, testar e gerar o instalador
        shell: cmd
        run: build.bat

      # Assinatura gratuita (SignPath Foundation): ver docs/ASSINATURA.md. Enquanto nao estiver
      # aprovada, o instalador sai SEM assinatura e as notas da versao dizem-no.

      - name: Pacote para compilar no PC (instalar.bat)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          git archive --format=zip -o "dist\FS25_RealFFB_Compilar_no_PC_$v.zip" HEAD
          $h = (Get-FileHash "dist\FS25_RealFFB_Compilar_no_PC_$v.zip" -Algorithm SHA256).Hash.ToLower()
          Add-Content dist\SHA256SUMS.txt "$h  FS25_RealFFB_Compilar_no_PC_$v.zip"

      - name: Notas da versao
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?(?=^## |\z)")
          $sums = Get-Content dist\SHA256SUMS.txt -Raw
          $body = @"
          $($m.Value)

          ### Verificar o ficheiro (SHA-256)
          ``````
          $sums
          ``````
          No PowerShell: ``Get-FileHash .\FS25_RealFFB_Setup_$v.exe -Algorithm SHA256`` - o valor tem de ser igual ao de cima.
          Guia: docs/INSTALACAO.md

          ### Qual descarregar
          - **FS25_RealFFB_Setup_$v.exe** - instalador normal. Ainda **nao tem assinatura digital** (ver docs/ASSINATURA.md): o SmartScreen pode mostrar "O Windows protegeu o PC" > "Mais informacoes" > "Executar assim mesmo". Com o **Smart App Control ligado** o Windows bloqueia-o.
          - **FS25_RealFFB_Compilar_no_PC_$v.zip** - para PCs com Smart App Control ligado: extraia e de dois cliques em ``instalar.bat``. Compila no seu PC com o compilador do proprio Windows (nao instala nada) e abre o mesmo instalador.
          "@
          Set-Content -Path notes.md -Value $body -Encoding utf8

      - name: Criar rascunho da Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          gh release create "v$v" --target "${{ github.sha }}" --draft --title "FS25 RealFFB $v" --notes-file notes.md `
            "dist\FS25_RealFFB_Setup_$v.exe" "dist\FS25_RealFFB_Compilar_no_PC_$v.zip" "dist\SHA256SUMS.txt"
