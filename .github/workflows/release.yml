# Publishes a release: push the commit to the 'lancamento' branch (or Actions > release > Run workflow).
# The vX.Y.Z tag (same as the VERSION file) is created by GitHub.
# The release (marked as pre-release/beta) contains the installer, the build-on-PC package and SHA256SUMS.txt.
name: release

on:
  push:
    branches: [lancamento]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }

      - name: Build, test and create the installer
        shell: cmd
        run: build.bat

      # Free signing (SignPath Foundation): see docs/SIGNING.md. Until approved, the installer
      # ships UNSIGNED and the release notes say so.

      - name: Build-on-PC package (install.bat)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          git archive --format=zip -o "dist\FS25_RealFFB_BuildOnPC_$v.zip" HEAD
          $h = (Get-FileHash "dist\FS25_RealFFB_BuildOnPC_$v.zip" -Algorithm SHA256).Hash.ToLower()
          Add-Content dist\SHA256SUMS.txt "$h  FS25_RealFFB_BuildOnPC_$v.zip"

      - name: Release notes
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?(?=^## |\z)")
          $sums = Get-Content dist\SHA256SUMS.txt -Raw
          $body = @"
          $($m.Value)

          ### Which file to download
          - **FS25_RealFFB_Setup_$v.exe** - the normal installer (English, Português, Español, Français). It is **not digitally signed yet** (see docs/SIGNING.md): SmartScreen may show "Windows protected your PC" > "More info" > "Run anyway". With **Smart App Control on**, Windows blocks it.
          - **FS25_RealFFB_BuildOnPC_$v.zip** - for PCs with Smart App Control on: extract it and double-click ``install.bat``. It compiles the app on your PC with the compiler built into Windows (nothing to install) and opens the same installer.

          ### Verify the file (SHA-256)
          ``````
          $sums
          ``````
          In PowerShell: ``Get-FileHash .\FS25_RealFFB_Setup_$v.exe -Algorithm SHA256`` - the value must match the one above.
          Guide: docs/INSTALL.md
          "@
          Set-Content -Path notes.md -Value $body -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          gh release create "v$v" --target "${{ github.sha }}" --prerelease --title "FS25 RealFFB $v beta" --notes-file notes.md `
            "dist\FS25_RealFFB_Setup_$v.exe" "dist\FS25_RealFFB_BuildOnPC_$v.zip" "dist\SHA256SUMS.txt"
