; FS25 RealFFB - device catalog (data, not code). Copyright (c) 2026 OptimusZuka.
;
; Embedded in RealFFB.exe at build time. A file with the same format in
; %APPDATA%\FS25 RealFFB\devices.ini overrides or adds entries (for testers).
;
; Sections:
;   [vendor:VVVV]     defaults for every device of that USB vendor ID
;   [VVVV:PPPP]       one product (USB vendor:product ID, hexadecimal)
;   [model:REGEX]     one product identified by the EXACT model token in the device name (case-insensitive
;                     regular expression). Used only when the USB product ID is not listed. Never a brand alone.
;   [name:TEXT]       brand hint from the device name (defaults only: never a torque)
; Keys:
;   Model       display name
;   PeakNm      manufacturer peak torque (0 or missing = unknown -> the app assumes 20 Nm and asks to calibrate).
;               For an identified model it is also the HARD CEILING: the configured peak can never be higher.
;   Rating      Peak (default) | Sustained  (sustained = the maker publishes continuous torque, not peak)
;   Drive       DirectDrive | Belt | Gear
;   Validation  Confirmed | Documented | Theoretical | Experimental | NotSupported
;               Confirmed = tested on real hardware with FS25 RealFFB. Nothing else may use it.
;   Quirks      comma list: StopAllOnOpen, AutocenterOffEachAcquire, SpringFloor1, SpringBoost=<0..10000>
;   Notes       one line shown in the Hardware page
;   Source      where the entry comes from (code history, manufacturer documentation, user report)
;
; Only product IDs already validated in the project's code history are listed. Devices that are not
; listed still work through their detected capabilities (see docs/dev/COMPATIBILITY-MATRIX.md).

