<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFCC00"/>
    </marker>
  </defs>
  <rect width="900" height="330" rx="16" fill="#0E0E0E"/>
  <!-- FS25 -->
  <rect x="30" y="40" width="230" height="250" rx="12" fill="#1A1A1A" stroke="#333"/>
  <text x="145" y="72" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">Farming Simulator 25</text>
  <rect x="50" y="95" width="190" height="70" rx="8" fill="#262626" stroke="#FFCC00"/>
  <text x="145" y="124" text-anchor="middle" fill="#FFCC00" font-size="14" font-weight="600">Mod Real FFB Telemetry</text>
  <text x="145" y="145" text-anchor="middle" fill="#BBBBBB" font-size="12">lê o trator a cada frame</text>
  <text x="145" y="200" text-anchor="middle" fill="#BBBBBB" font-size="12">velocidade · massa · piso</text>
  <text x="145" y="218" text-anchor="middle" fill="#BBBBBB" font-size="12">suspensão · rodas · motor</text>
  <text x="145" y="262" text-anchor="middle" fill="#777777" font-size="12">não vê o volante (HidHide)</text>
  <!-- App -->
  <rect x="335" y="40" width="230" height="250" rx="12" fill="#1A1A1A" stroke="#FFCC00" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">RealFFB.exe</text>
  <text x="450" y="104" text-anchor="middle" fill="#FFCC00" font-size="13">motor de force feedback</text>
  <text x="450" y="132" text-anchor="middle" fill="#BBBBBB" font-size="12">centragem pela velocidade</text>
  <text x="450" y="150" text-anchor="middle" fill="#BBBBBB" font-size="12">amortecimento · atrito</text>
  <text x="450" y="168" text-anchor="middle" fill="#BBBBBB" font-size="12">buracos · impactos · textura</text>
  <text x="450" y="186" text-anchor="middle" fill="#BBBBBB" font-size="12">vibração do motor</text>
  <text x="450" y="222" text-anchor="middle" fill="#FFCC00" font-size="13">ponte de comandos</text>
  <text x="450" y="242" text-anchor="middle" fill="#BBBBBB" font-size="12">direção e pedais → jogo</text>
  <text x="450" y="270" text-anchor="middle" fill="#777777" font-size="12">perfil por veículo</text>
  <!-- Wheel -->
  <rect x="640" y="40" width="230" height="250" rx="12" fill="#1A1A1A" stroke="#333"/>
  <text x="755" y="72" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">Volante</text>
  <circle cx="755" cy="160" r="52" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <rect x="709" y="152" width="92" height="14" fill="#FFFFFF"/>
  <rect x="748" y="160" width="14" height="48" fill="#FFFFFF"/>
  <circle cx="755" cy="160" r="14" fill="#FFCC00"/>
  <text x="755" y="250" text-anchor="middle" fill="#BBBBBB" font-size="12">Fanatec · Logitech G29/G920/G923</text>
  <text x="755" y="270" text-anchor="middle" fill="#777777" font-size="12">DirectInput, modo exclusivo</text>
  <!-- arrows -->
  <line x1="262" y1="120" x2="330" y2="120" stroke="#FFCC00" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="296" y="110" text-anchor="middle" fill="#FFCC00" font-size="11">telemetria</text>
  <line x1="330" y1="230" x2="262" y2="230" stroke="#FFCC00" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="296" y="250" text-anchor="middle" fill="#FFCC00" font-size="11">comandos</text>
  <line x1="567" y1="135" x2="635" y2="135" stroke="#FFCC00" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="601" y="125" text-anchor="middle" fill="#FFCC00" font-size="11">força</text>
  <line x1="635" y1="215" x2="567" y2="215" stroke="#FFCC00" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="601" y="235" text-anchor="middle" fill="#FFCC00" font-size="11">eixos</text>
</svg>
